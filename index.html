<!DOCTYPE html>
<html lang="zh-TW">
<head>

<title>Web Minecraft - Voxel Engine</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
body, html { width: 100%; height: 100%; overflow: hidden; background-color: #78a7ff; font-family: 'VT323', monospace; }
#game-canvas { display: block; width: 100%; height: 100%; }
#crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); pointer-events: none; mix-blend-mode: difference; z-index: 10; }
#crosshair::before, #crosshair::after { content: ''; position: absolute; background: white; }
#crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
#crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }
#hotbar-container { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; background: rgba(0,0,0,0.4); border: 2px solid #222; z-index: 10; image-rendering: pixelated; }
.hotbar-slot { width: 44px; height: 44px; border: 2px solid #888; border-right-color: #444; border-bottom-color: #444; margin: 2px; position: relative; background: #8b8b8b; opacity: 0.8; }
.hotbar-slot.active { border: 3px solid #fff; opacity: 1; transform: scale(1.05); z-index: 11; }
.slot-img { width: 100%; height: 100%; background-size: contain; background-position: center; background-repeat: no-repeat; image-rendering: pixelated; }
#ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; color: white; }
.mc-title { font-size: 64px; text-shadow: 4px 4px 0 #000; margin-bottom: 40px; letter-spacing: 2px; color: #fff; }
.mc-btn { background: #717171; border: 2px solid #000; border-top-color: #a0a0a0; border-left-color: #a0a0a0; color: #fff; font-size: 24px; padding: 12px 40px; width: 400px; max-width: 90vw; text-align: center; cursor: pointer; margin-bottom: 15px; font-family: 'VT323', monospace; text-shadow: 2px 2px 0 #333; }
.mc-btn:hover { background: #8692ce; border-top-color: #b5c1fb; border-left-color: #b5c1fb; }
#debug-screen { position: absolute; top: 172px; left: 10px; color: white; font-size: 18px; text-shadow: 1px 1px 0 #000; z-index: 10; pointer-events: none; line-height: 1.2; }
.hidden { display: none !important; }
#hearts{position:absolute;bottom:64px;left:calc(50% - 155px);z-index:10;font-size:22px;letter-spacing:2px;text-shadow:1px 1px 0 #000;pointer-events:none}
#hunger{position:absolute;bottom:64px;left:calc(50% + 25px);z-index:10;font-size:22px;letter-spacing:2px;text-shadow:1px 1px 0 #000;pointer-events:none}
#minimap{position:absolute;top:10px;left:10px;width:150px;height:150px;border:3px solid #000;outline:2px solid #9a9a9a;z-index:11;image-rendering:pixelated;background:#111;display:none;pointer-events:none}
#bigmap{position:absolute;inset:0;z-index:14;background:rgba(0,0,0,.65);display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;color:#fff;text-shadow:2px 2px 0 #000;font-size:24px}
#bigmap.open{display:flex}
#bigmap-cv{border:4px solid #000;outline:3px solid #aaa;image-rendering:pixelated;background:#111;margin-top:8px}
#lobby,#pause,#auth{display:flex;flex-direction:column;align-items:center}
#acc-name,#acc-pass{font-family:'VT323',monospace;font-size:28px;width:230px;text-align:center;background:#222;color:#fff;border:2px solid #a0a0a0;padding:8px;margin-bottom:12px;user-select:text;-webkit-user-select:text;outline:none}
#acc-bar{font-size:24px;margin-bottom:14px;text-shadow:2px 2px 0 #333}.link{text-decoration:underline;cursor:pointer;color:#ffe066}
#auth-status{font-size:24px;min-height:30px;text-align:center;text-shadow:2px 2px 0 #333;color:#ffb0b0}
#room-input,#name-input{font-family:'VT323',monospace;font-size:28px;width:230px;text-align:center;text-transform:uppercase;background:#222;color:#fff;border:2px solid #a0a0a0;padding:8px;user-select:text;-webkit-user-select:text;outline:none}
#net-status,#room-info{font-size:26px;text-align:center;min-height:30px;text-shadow:2px 2px 0 #333}
#room-info{color:#ffe066}
.slot-count{position:absolute;right:2px;bottom:0;color:#fff;font-size:18px;text-shadow:1px 1px 0 #000}
#hurt{position:absolute;inset:0;background:rgba(255,0,0,.28);opacity:0;transition:opacity .35s;pointer-events:none;z-index:15}
#hint{position:absolute;top:10px;right:10px;color:#fff;font-size:18px;text-shadow:1px 1px 0 #000;z-index:10;text-align:right;pointer-events:none;line-height:1.2}
#chat-log{position:absolute;left:10px;bottom:120px;width:min(520px,60vw);max-height:40vh;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;z-index:12;pointer-events:none;font-size:22px;line-height:1.15;text-shadow:1px 1px 0 #000;color:#fff}
.chat-line{background:rgba(0,0,0,.4);padding:2px 6px;margin-top:1px;word-break:break-all}
.chat-line.old{display:none}
#chat-log.open .chat-line.old{display:block}
#chat-box{position:absolute;left:10px;bottom:10px;width:min(520px,60vw);z-index:40;display:none}
#chat-box.open{display:block}
#chat-input{width:100%;font-family:'VT323',monospace;font-size:24px;background:rgba(0,0,0,.7);color:#fff;border:2px solid #aaa;padding:4px 8px;outline:none;user-select:text;-webkit-user-select:text}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<body>
<canvas id="game-canvas"></canvas>
<div id="crosshair"></div>
<div id="hearts"></div>
<div id="hunger"></div>
<div id="hurt"></div>
<div id="chat-log"></div>
<canvas id="minimap" width="150" height="150"></canvas>
<div id="bigmap"><div id="bigmap-title">世界地圖　(M 關閉　滾輪縮放)</div><canvas id="bigmap-cv"></canvas></div>
<div id="chat-box"><input id="chat-input" maxlength="100" autocomplete="off" placeholder="輸入訊息，Enter 送出，Esc 取消"></div>
<div id="hint">Enter 聊天 (/tp 名字、/god、/rd 距離)<br>F4 切換視角<br>按住右鍵：盾牌格擋<br>桶子右鍵：取/放水與岩漿<br>R 穿戴裝備<br>M 大地圖<br>E 物品欄 / 2x2合成<br>Q 丟棄 (Ctrl+Q 整組)<br>右鍵拿食物：食用<br>左鍵攻擊生物<br>N 音效開關<br>數字鍵切換快捷列</div>
<div id="hotbar-container"></div>
<div id="debug-screen" class="hidden"></div>
<div id="ui-layer">
    <div class="mc-title" id="mc-title">WEB MINECRAFT</div>
    <div id="auth">
        <div style="font-size:30px;margin-bottom:12px;text-shadow:2px 2px 0 #333">登入帳號</div>
        <input id="acc-name" maxlength="12" placeholder="帳號 (2~12 字)" autocomplete="username">
        <input id="acc-pass" type="password" maxlength="40" placeholder="密碼 (至少 4 字)" autocomplete="current-password">
        <div class="mc-btn" id="btn-login">登入</div>
        <div class="mc-btn" id="btn-register">註冊新帳號</div>
        <div id="auth-status"></div>
    </div>
    <div id="lobby" class="hidden">
        <div id="acc-bar">👤 <span id="acc-label"></span>　<span class="link" id="btn-logout">登出</span></div>
        <div class="mc-btn hidden" id="btn-continue">繼續遊戲 (單人)</div>
        <div class="mc-btn" id="btn-solo">新單人遊戲</div>
        <div class="mc-btn" id="btn-host">建立房間 (多人)</div>
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:15px">
            <input id="room-input" maxlength="5" placeholder="房間代碼">
            <div class="mc-btn" id="btn-join" style="width:150px;margin:0;padding:12px 10px">加入</div>
        </div>
        <div id="net-status"></div>
    </div>
    <div id="pause" class="hidden">
        <div id="room-info"></div>
        <div class="mc-btn" id="btn-play">回到遊戲 (Click to Play)</div>
        <div class="mc-btn" id="btn-save">儲存遊戲</div>
        <div class="mc-btn" id="btn-exit">儲存並回主選單</div>
        <div class="mc-btn" id="btn-info">WASD移動 | 空白鍵跳躍 | 按住左鍵挖掘 | 右鍵放置</div>
    </div>
</div>

<script>
(() => {   // 整份程式包在函式裡：主控台再也無法直接讀寫 hp、slots、player 等變數
const ANTI_TAMPER = true;   // 自己開發/除錯時改成 false，就不會擋 F12
// ---- 防竄改（只能提高門檻，無法真正阻止）----
let devOpen = false, devHit = false;
if (ANTI_TAMPER) {
    const devEl = new Image(); Object.defineProperty(devEl, 'id', { get() { devHit = true; return ''; } });
    const devWarn = document.createElement('div');
    devWarn.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#000;color:#fff;display:none;align-items:center;justify-content:center;font:32px monospace;text-align:center;padding:20px';
    devWarn.textContent = '偵測到開發者工具已開啟，請關閉後遊戲才會繼續';
    document.body.appendChild(devWarn);
    const setDev = o => { if (o === devOpen) return; devOpen = o; devWarn.style.display = o ? 'flex' : 'none'; if (o) { try { document.exitPointerLock(); } catch (e) {} } };
    window.addEventListener('keydown', e => {   // 擋 F12、Ctrl+Shift+I/J/C、Ctrl+U、Mac 的 Cmd+Opt+I/J/U
        const k = e.code, ctrl = e.ctrlKey || e.metaKey;
        if (k === 'F12' || (ctrl && e.shiftKey && (k === 'KeyI' || k === 'KeyJ' || k === 'KeyC')) || (ctrl && k === 'KeyU') || (e.metaKey && e.altKey && (k === 'KeyI' || k === 'KeyJ' || k === 'KeyU'))) { e.preventDefault(); e.stopImmediatePropagation(); }
    }, true);
    document.addEventListener('contextmenu', e => e.preventDefault());
    setInterval(() => {   // 偵測開發者工具：主控台物件被讀取、或 debugger 暫停
        const hit = devHit; devHit = false; console.log(devEl);
        const t = performance.now(); debugger; const slow = performance.now() - t > 100;
        setDev(hit || slow);
    }, 1000);
}
const BLOCK = { AIR: 0, GRASS: 1, DIRT: 2, STONE: 3, COBBLESTONE: 4, WOOD: 5, PLANKS: 6, LEAVES: 7, BRICK: 8, SAND: 9, GLASS: 10, BEDROCK: 11, CRAFT: 12, HAY: 13, DOOR: 14, PATH: 15, FARM: 16, LAMP: 17, WATER: 18, CROP: 19, BED: 20 };
BLOCK.COAL_ORE = 31; BLOCK.DIAMOND_ORE = 33; BLOCK.CHESTB = 34; BLOCK.LAVA = 35; BLOCK.OBS = 39; BLOCK.NETHERRACK = 40; BLOCK.SOULSAND = 41; BLOCK.GLOWSTONE = 42; BLOCK.PORTALA = 43; BLOCK.PORTALB = 44; BLOCK.GRAVEL = 45; BLOCK.TORCH = 46; BLOCK.IRON_ORE = 32; BLOCK.CROP1 = 21; BLOCK.CROP2 = 22; BLOCK.CROP3 = 23; for (let l = 1; l <= 7; l++) BLOCK['FW' + l] = 23 + l;
const isCrop = b => b === 19 || (b >= 21 && b <= 23), isW = b => b === 18 || (b >= 24 && b <= 30), wLvl = b => b === 18 ? 0 : b - 23;
// ---- 音效系統（WebAudio 即時合成，不需任何外部音檔；按 N 可開關）----
const { sfx, sfxAt, stepTick, feetMat, matOf, ambientTick, remoteBlockSnd } = (() => {
    let ac = null, master = null, nbuf = null, muted = false, ambT = 0, stepD = 0, wasWater = false, swimT = 0;
    try { muted = localStorage.getItem('mc_mute') === '1'; } catch (e) {}
    const gate = {};
    function init() {
        if (ac) return;
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        try { ac = new AC(); } catch (e) { return; }
        master = ac.createGain(); master.gain.value = muted ? 0 : .7;
        const cp = ac.createDynamicsCompressor(); master.connect(cp); cp.connect(ac.destination);
        nbuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const unlock = () => { init(); if (ac && ac.state !== 'running') ac.resume().catch(() => {}); };
    for (const ev of ['pointerdown', 'mousedown', 'keydown', 'touchstart']) window.addEventListener(ev, unlock, true);
    const out = pan => { if (!pan || !ac.createStereoPanner) return master; const p = ac.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan)); p.connect(master); return p; };

    function tone(f0, f1, dur, type, v, o = {}) {
        const t0 = ac.currentTime + (o.t || 0), osc = ac.createOscillator(), g = ac.createGain();
        osc.type = type; osc.frequency.setValueAtTime(f0, t0);
        if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
        const a = Math.min(o.a || .006, dur * .5);
        g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(Math.max(.0002, v), t0 + a); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
        let n = osc;
        if (o.lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; osc.connect(f); n = f; }
        n.connect(g); g.connect(out(o.pan));
        if (o.vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = o.vib[0]; lg.gain.value = o.vib[1]; l.connect(lg); lg.connect(osc.frequency); l.start(t0); l.stop(t0 + dur + .05); }
        osc.start(t0); osc.stop(t0 + dur + .05);
    }
    function noise(dur, ft, f0, f1, q, v, o = {}) {
        const t0 = ac.currentTime + (o.t || 0), s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
        s.buffer = nbuf; s.loop = true; f.type = ft; f.Q.value = q; f.frequency.setValueAtTime(f0, t0);
        if (f1 !== f0) f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
        const a = Math.min(o.a || .004, dur * .5);
        g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(Math.max(.0002, v), t0 + a); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
        s.connect(f); f.connect(g); g.connect(out(o.pan)); s.start(t0, Math.random() * .8); s.stop(t0 + dur + .05);
    }

    // 方塊材質
    const MATS = {
        grass: { nt: 'bandpass', nf: 1500, q: .6, d: .09 },
        dirt: { nt: 'lowpass', nf: 900, q: .5, d: .1, tf: 95, tt: 'sine' },
        sand: { nt: 'highpass', nf: 2800, q: .4, d: .12 },
        gravel: { nt: 'bandpass', nf: 2400, q: .9, d: .11 },
        stone: { nt: 'bandpass', nf: 1100, q: 1.5, d: .08, tf: 180, tt: 'square' },
        wood: { nt: 'bandpass', nf: 650, q: 1.2, d: .09, tf: 210, tt: 'triangle' },
        glass: { nt: 'highpass', nf: 4200, q: .5, d: .05, tf: 2600, tt: 'sine' },
        cloth: { nt: 'lowpass', nf: 600, q: .4, d: .1 }
    };
    function matOf(b) {
        if (b === 1 || b === 7 || b === 19 || (b >= 21 && b <= 23) || b === 46) return 'grass';
        if (b === 2 || b === 15 || b === 16 || b === 41) return 'dirt';
        if (b === 9) return 'sand';
        if (b === 45) return 'gravel';
        if (b === 10 || b === 17) return 'glass';
        if (b === 5 || b === 6 || b === 12 || b === 13 || b === 14 || b === 34) return 'wood';
        if (b === 20) return 'cloth';
        return 'stone';
    }
    function blockSnd(mat, kind, v, pan) {
        const m = MATS[mat] || MATS.stone, big = kind === 'break', k = big ? 1.5 : kind === 'place' ? 1.1 : kind === 'dig' ? .8 : .45;
        const jit = .88 + Math.random() * .24, dur = m.d * (big ? 1.7 : 1);
        noise(dur, m.nt, m.nf * jit * (kind === 'place' ? .85 : 1), m.nf * .55, m.q, .55 * k * v, { pan });
        if (m.tf) tone(m.tf * jit, m.tf * .6, dur, m.tt, .22 * k * v, { pan });
        if (big && (mat === 'gravel' || mat === 'stone' || mat === 'wood')) noise(dur * .8, m.nt, m.nf * 1.2 * jit, m.nf * .5, m.q, .4 * k * v, { pan, t: .05 });
        if (mat === 'glass' && (big || kind === 'place')) for (let i = 0; i < (big ? 5 : 2); i++) tone(2200 + Math.random() * 2600, 1800, .12 + Math.random() * .1, 'sine', .12 * v, { pan, t: Math.random() * .12 });
    }

    // 生物叫聲：spec = 'pig:say' | 'pig:hurt' | 'pig:death'
    function mobSnd(spec, v, pan) {
        const [type, kind = 'say'] = spec.split(':'), hu = kind === 'hurt', de = kind === 'death', r = .92 + Math.random() * .16, o = { pan };
        switch (type) {
            case 'cow':
                tone((de ? 150 : hu ? 190 : 120) * r, de ? 45 : hu ? 110 : 85, de ? .9 : hu ? .35 : .75, 'sawtooth', .28 * v, { ...o, lp: 800, vib: [5, 6] }); break;
            case 'sheep':
                tone((de ? 420 : hu ? 480 : 360) * r, de ? 120 : hu ? 380 : 300, de ? .6 : hu ? .3 : .55, 'sawtooth', .2 * v, { ...o, lp: 1400, vib: [26, 28] }); break;
            case 'chicken':
                for (let i = 0; i < (hu ? 1 : 3); i++) tone((hu ? 1300 : 1000 + i * 150) * r, hu ? 700 : 1500 + i * 100, hu ? .15 : .06, 'square', .12 * v, { ...o, t: i * .09, lp: 3000 }); break;
            case 'rabbit':
                tone(1700 * r, 1100 * r, .08, 'square', .1 * v, { ...o, lp: 3000 }); break;
            case 'horse':
                if (hu) tone(800 * r, 500, .3, 'sawtooth', .2 * v, { ...o, lp: 2400, vib: [14, 30] });
                else { tone(560 * r, 1050 * r, .25, 'sawtooth', .2 * v, { ...o, lp: 2600, vib: [14, 30] }); tone(1050 * r, de ? 250 : 420, de ? .8 : .45, 'sawtooth', .2 * v, { ...o, lp: 2400, vib: [14, 30], t: .25 }); } break;
            case 'wolf':
                if (hu || de) tone(900 * r, de ? 300 : 550, de ? .9 : .35, 'sine', .2 * v, { ...o, vib: [8, 40] });
                else { tone(95 * r, 70 * r, .6, 'sawtooth', .22 * v, { ...o, lp: 600, vib: [30, 12] }); noise(.55, 'lowpass', 500, 300, .6, .15 * v, o); } break;
            case 'zombie':
                if (de) tone(110 * r, 38, 1, 'sawtooth', .28 * v, { ...o, lp: 500, vib: [6, 10] });
                else if (hu) tone(160 * r, 95, .3, 'sawtooth', .25 * v, { ...o, lp: 600 });
                else { tone(115 * r, 78 * r, .8, 'sawtooth', .26 * v, { ...o, lp: 520, vib: [7, 14] }); noise(.7, 'lowpass', 420, 200, .8, .16 * v, o); } break;
            case 'villager':
                if (de) tone(280 * r, 90, .6, 'sawtooth', .2 * v, { ...o, lp: 1100 });
                else if (hu) tone(300 * r, 200, .25, 'sawtooth', .2 * v, { ...o, lp: 1200 });
                else { tone(210 * r, 250 * r, .14, 'sawtooth', .2 * v, { ...o, lp: 1100 }); tone(270 * r, 200 * r, .2, 'sawtooth', .2 * v, { ...o, lp: 1100, t: .17 }); } break;
            case 'pigman':
                if (de) tone(160 * r, 50, .8, 'sawtooth', .25 * v, { ...o, lp: 700 });
                else if (hu) tone(220 * r, 120, .3, 'sawtooth', .25 * v, { ...o, lp: 900 });
                else { tone(135 * r, 90 * r, .3, 'sawtooth', .25 * v, { ...o, lp: 700 }); tone(70, 60, .3, 'square', .15 * v, o); } break;
            default: // pig 與其他
                if (hu || de) tone(700 * r, de ? 180 : 420, de ? .55 : .25, 'sawtooth', .22 * v, { ...o, lp: 2200 });
                else { tone(240 * r, 150 * r, .16, 'sawtooth', .22 * v, { ...o, lp: 1200 }); tone(250 * r, 170 * r, .14, 'sawtooth', .18 * v, { ...o, lp: 1200, t: .2 }); }
                noise(.12, 'bandpass', 500, 300, 1, .12 * v, o);
        }
    }

    const GAP = { dig: .1, hurt: .25, pop: .04, step: .12, break: .03, place: .03, mob: .08, click: .03, slot: .03, swim: .3, splash: .2, land: .15, hit: .12 };
    function play(kind, a, v, pan) {
        switch (kind) {
            case 'step': case 'dig': case 'break': case 'place': blockSnd(a, kind, v, pan); break;
            case 'jump': noise(.07, 'lowpass', 500, 300, .5, .1 * v, { pan }); break;
            case 'land': noise(.12, 'lowpass', 500, 200, .6, .5 * v, { pan }); tone(110, 45, .16, 'sine', .35 * v, { pan }); break;
            case 'hurt': tone(320, 140, .2, 'sawtooth', .3 * v, { pan, lp: 1800 }); tone(240, 110, .22, 'square', .15 * v, { pan, lp: 1500 }); noise(.1, 'bandpass', 900, 400, .8, .25 * v, { pan }); break;
            case 'death': tone(380, 50, .9, 'sawtooth', .3 * v, { lp: 1500 }); tone(280, 40, 1, 'square', .14 * v, { lp: 1000 }); break;
            case 'eat': for (let i = 0; i < 3; i++) { noise(.07, 'bandpass', 1800 + Math.random() * 500, 900, 1.4, .5 * v, { t: i * .14 }); tone(220, 140, .05, 'square', .08 * v, { t: i * .14 }); } break;

function raycastVoxel() {
    _start.copy(camera.position);
    _dir.set(0, 0, -1).applyQuaternion(camera.quaternion).normalize();
    const start = _start, dir = _dir;

    let x = Math.floor(start.x), y = Math.floor(start.y), z = Math.floor(start.z);
    const stepX = Math.sign(dir.x), stepY = Math.sign(dir.y), stepZ = Math.sign(dir.z);
    const tDeltaX = stepX !== 0 ? Math.abs(1 / dir.x) : Infinity;
    const tDeltaY = stepY !== 0 ? Math.abs(1 / dir.y) : Infinity;
    const tDeltaZ = stepZ !== 0 ? Math.abs(1 / dir.z) : Infinity;
    let tMaxX = stepX > 0 ? (x + 1 - start.x) * tDeltaX : (start.x - x) * tDeltaX;
    let tMaxY = stepY > 0 ? (y + 1 - start.y) * tDeltaY : (start.y - y) * tDeltaY;
    let tMaxZ = stepZ > 0 ? (z + 1 - start.z) * tDeltaZ : (start.z - z) * tDeltaZ;

    const maxDist = 5.0;
    let normX = 0, normY = 0, normZ = 0;

    for (let i = 0; i < 20; i++) {
        if (tMaxX < tMaxY) {
            if (tMaxX < tMaxZ) { if (tMaxX > maxDist) break; x += stepX; tMaxX += tDeltaX; normX = -stepX; normY = 0; normZ = 0; }
            else { if (tMaxZ > maxDist) break; z += stepZ; tMaxZ += tDeltaZ; normX = 0; normY = 0; normZ = -stepZ; }
        } else {
            if (tMaxY < tMaxZ) { if (tMaxY > maxDist) break; y += stepY; tMaxY += tDeltaY; normX = 0; normY = -stepY; normZ = 0; }
            else { if (tMaxZ > maxDist) break; z += stepZ; tMaxZ += tDeltaZ; normX = 0; normY = 0; normZ = -stepZ; }
        }
        if (getBlockGlobal(x, y, z) !== BLOCK.AIR && !isW(getBlockGlobal(x, y, z)) && !isL(getBlockGlobal(x, y, z)) && !isPortal(getBlockGlobal(x, y, z))) {
            targetBlock = { x, y, z, placeX: x + normX, placeY: y + normY, placeZ: z + normZ };
            selectionBox.position.set(x + 0.5, y + 0.5, z + 0.5);
            selectionBox.visible = true;
            return;
        }
    }
    targetBlock = null;
    selectionBox.visible = false;
}

        }
    }

    if (document.pointerLockElement || (started && conns.length)) {   // 連機時開聊天/選單也不暫停世界
        updatePhysics(dt); portalTick(dt);
        raycastVoxel();
        updateMining(dt);
        updateMobs(dt); ambientTick(dt);
        updateDrops(dt);
        hungerT += dt;
        if(hungerT>=30){hungerT=0; hunger=Math.max(0,hunger-1); drawHunger();}
        if(hunger<=0 && Math.floor(now/2000)!==Math.floor((now-dt*1000)/2000) && hp>1){hurt(1);}
        if (hp < 20 && performance.now() - lastHurt > 5000) { regenT += dt; if (regenT >= 2) { regenT = 0; hp++; drawHearts(); } }
        updateChunks(player.pos);
        processQueues();
        if ((cullT += dt) > .25) { cullT = 0; cullChunks(); }
    }
    netTick(dt);
    updateView(dt); updateMaps(dt);
    renderer.render(scene, camView ? viewCam : camera);
    if (!invOpen && !camView) { handCam.aspect = camera.aspect; handCam.updateProjectionMatrix(); renderer.autoClear = false; renderer.clearDepth(); renderer.render(handScene, handCam); renderer.autoClear = true; }
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updatePrecisionMatrix ? camera.updatePrecisionMatrix() : camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

gameLoop();
})();
</script>
</body>
</html>
